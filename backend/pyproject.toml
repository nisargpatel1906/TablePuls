[project]
name = "tablepulse-backend"
version = "1.0.0"
description = "TablePulse FastAPI Backend, Auth/RBAC, Analytics, and Admin CLI"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.9",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
    "valkey==6.2.0",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "typer==0.29.2",
    "pyotp==2.12.1",
    "zxcvbn==4.5.0",
    "python-multipart==0.0.34",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.17",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pip-licenses==5.5.5",
    "pip-audit==2.10.1",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
tablepulse = "app.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
