[project]
name = "tablepulse-ml"
version = "1.0.0"
description = "TablePulse ML Evaluation Harness, Leakage-Free Splits, Baselines, and Release Gate"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy==2.5.5",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "pillow==13.0.0",
    "opencv-python-headless==5.1.0.95",
    "onnxruntime==1.32.0",
    "pyyaml==6.0.4",
    "pydantic==2.14.4",
]

[project.optional-dependencies]
train = [
    "rfdetr==1.12.1",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pip-licenses==5.5.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
